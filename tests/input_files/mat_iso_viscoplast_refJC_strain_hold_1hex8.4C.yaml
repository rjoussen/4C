TITLE:
  - "Viscoplastic stress relaxation of a single hex8 under a homogeneous uniaxial strain that is"
  - "ramped up and then held constant. All nodes are prescribed, so every time step of the hold"
  - "evaluates the material at the same deformation gradient. The material must still integrate the"
  - "new time step, i.e., the stress keeps relaxing during the hold."
PROBLEM TYPE:
  PROBLEMTYPE: Structure
PROBLEM SIZE:
  DIM: 3
STRUCTURAL DYNAMIC:
  INT_STRATEGY: Standard
  DYNAMICTYPE: Statics
  TIMESTEP: 0.01
  NUMSTEP: 10
  MAXTIME: 0.1
  TOLDISP: 1.0e-6
  TOLRES: 1.0e-6
  PREDICT: ConstDis
  LINEAR_SOLVER: 1
IO:
  STRUCT_STRESS: Cauchy
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 10
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  STRESS_STRAIN: true
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7830
  - MAT: 2
    ELAST_CoupNeoHooke:
      YOUNG: 200000
      NUE: 0.29
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      VISCOPLAST_LAW_ID: 4
      FIBER_READER_ID: 5
      YIELD_COND_A: 0
      YIELD_COND_B: 0
      YIELD_COND_F: 0
      MAT_BEHAVIOR: "isotropic"
      TIME_INTEGRATION_HIST_VARS: logarithmic
      LOCAL_SUBSTEPPING:
        USE_SUBSTEPPING: true
        MAX_SUBSTEPPING_HALVE_NUM: 8
      LOCAL_NEWTON:
        CONV_CHECK: residual_and_increment_ratio
        MAX_ITER: 100
        RES_TOL: 1e-8
        INCR_TOL: 1e-8
        MAX_EXCEEDANCE_FACT_RES_TOL: 10
        MAX_EXCEEDANCE_FACT_INCR_TOL: 10
        DIVER_CONT: stop
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1
      STRAIN_RATE_EXP_FAC: 0.014
      INIT_YIELD_STRENGTH: 792
      ISOTROP_HARDEN_PREFAC: 510
      ISOTROP_HARDEN_EXP: 0.26
      REF_TEMPERATURE: 300
      MELT_TEMPERATURE: 400
      TEMPERATURE_SENS: 0.1
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: Standard
SOLVER 1:
  SOLVER: "UMFPACK"
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "0.01 * x * a"
  - VARIABLE: 0
    NAME: "a"
    TYPE: "linearinterpolation"
    NUMPOINTS: 3
    TIMES: [0, 0.05, 1]
    VALUES: [0, 1, 1]
DESIGN VOL DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [1, 0, 0]
    FUNCT: [1, 0, 0]
DVOL-NODE TOPOLOGY:
  - "NODE 1 DVOLUME 1"
  - "NODE 2 DVOLUME 1"
  - "NODE 3 DVOLUME 1"
  - "NODE 4 DVOLUME 1"
  - "NODE 5 DVOLUME 1"
  - "NODE 6 DVOLUME 1"
  - "NODE 7 DVOLUME 1"
  - "NODE 8 DVOLUME 1"
NODE COORDS:
  - "NODE 1 COORD 0.0 -0.5 0.5"
  - "NODE 2 COORD 0.0 -0.5 -0.5"
  - "NODE 3 COORD 0.0 0.5 -0.5"
  - "NODE 4 COORD 0.0 0.5 0.5"
  - "NODE 5 COORD 1.0 -0.5 0.5"
  - "NODE 6 COORD 1.0 -0.5 -0.5"
  - "NODE 7 COORD 1.0 0.5 -0.5"
  - "NODE 8 COORD 1.0 0.5 0.5"
STRUCTURE ELEMENTS:
  - "1 SOLID HEX8 1 2 3 4 5 6 7 8 MAT 1 KINEM nonlinear"
RESULT DESCRIPTION:
  - STRUCTURE:
      DIS: "structure"
      NODE: 5
      QUANTITY: "stress_xx"
      VALUE: 2.15509793345113758e+03
      TOLERANCE: 1e-8
