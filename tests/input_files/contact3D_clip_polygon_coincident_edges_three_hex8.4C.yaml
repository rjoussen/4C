TITLE:
  - "Clip polygon test: a soft HEX8 cube (slave) is pressed with Coulomb friction onto a stiff box (master)
    of two HEX8 elements that are split at z=-0.5. The left edges of the two bodies coincide initially
    and stay nearly coincident during the deformation, so the polygon clipping yields nearly collinear
    points. The convex hull of these points used to drop a corner depending on round-off, so that half
    of a clip polygon was lost in some Newton iterations and Newton did not converge in the first step."

PROBLEM TYPE:
  PROBLEMTYPE: "Structure"

CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
  FRICTION: "Coulomb"
  SEMI_SMOOTH_CN: 500
  SEMI_SMOOTH_CT: 1000

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

