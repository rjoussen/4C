TITLE:
  - "A HEX8 source element, initially overlapping a HEX8 target element by 0.4, is pressed onto it and
    pushed sideways by 0.25 per step. After the first step, all source nodes are active and slipping.
    In the second step, the first Newton iteration moves the source surface beyond the target edge, so
    the source nodes are still active but have no projection anymore. Their jump must be skipped, since
    the subsequent active set update sets them inactive. The ConstDis predictor is required, since TangDis
    would already move the source surface off in the predictor."

PROBLEM TYPE:
  PROBLEMTYPE: "Structure"

IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  NODE_GID: true
  ELEMENT_GID: true
IO/MONITOR STRUCTURE DBC:
  INTERVAL_STEPS: 1

CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
  FRICTION: "Coulomb"
  SEMI_SMOOTH_CN: 100
  SEMI_SMOOTH_CT: 100

MORTAR COUPLING:
  SEARCH_ALGORITHM: "BruteForce"
  SEARCH_PARAM: 1

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  PREDICT: "ConstDis"
  RESULTSEVERY: 1
  TIMESTEP: 1
  NUMSTEP: 2
  MAXTIME: 2
  MAXITER: 30
  TOLDISP: 1e-10
  TOLRES: 1e-10
  LINEAR_SOLVER: 1

SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Direct_Solver"

MATERIALS:
  - MAT: 1
    MAT_Struct_StVenantKirchhoff:
      YOUNG: 1000
      NUE: 0.3
      DENS: 0

FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"

DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0.25, 0, -0.02]
    FUNCT: [1, 0, 1]

DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 2
    InterfaceID: 1
    Side: "Master"
    FrCoeffOrBound: 0.2
  - E: 3
    InterfaceID: 1
    Side: "Slave"
    FrCoeffOrBound: 0.2

DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
  - "NODE 5 DSURFACE 2"
  - "NODE 6 DSURFACE 2"
  - "NODE 7 DSURFACE 2"
  - "NODE 8 DSURFACE 2"
  - "NODE 9 DSURFACE 3"
  - "NODE 10 DSURFACE 3"
  - "NODE 11 DSURFACE 3"
  - "NODE 12 DSURFACE 3"
  - "NODE 13 DSURFACE 4"
  - "NODE 14 DSURFACE 4"
  - "NODE 15 DSURFACE 4"
  - "NODE 16 DSURFACE 4"

NODE COORDS:
  - "NODE 1 COORD 0.0 0.0 0.0"
  - "NODE 2 COORD 1.0 0.0 0.0"
  - "NODE 3 COORD 1.0 1.0 0.0"
  - "NODE 4 COORD 0.0 1.0 0.0"
  - "NODE 5 COORD 0.0 0.0 1.0"
  - "NODE 6 COORD 1.0 0.0 1.0"
  - "NODE 7 COORD 1.0 1.0 1.0"
  - "NODE 8 COORD 0.0 1.0 1.0"
  - "NODE 9 COORD 0.6 0.1 1.01"
  - "NODE 10 COORD 1.4 0.1 1.01"
  - "NODE 11 COORD 1.4 0.9 1.01"
  - "NODE 12 COORD 0.6 0.9 1.01"
  - "NODE 13 COORD 0.6 0.1 1.81"
  - "NODE 14 COORD 1.4 0.1 1.81"
  - "NODE 15 COORD 1.4 0.9 1.81"
  - "NODE 16 COORD 0.6 0.9 1.81"

STRUCTURE ELEMENTS:
  - "1 SOLID HEX8 1 2 3 4 5 6 7 8 MAT 1 KINEM nonlinear"
  - "2 SOLID HEX8 9 10 11 12 13 14 15 16 MAT 1 KINEM nonlinear"

RESULT DESCRIPTION:
  - STRUCTURE:
      DIS: "structure"
      NODE: 9
      QUANTITY: "dispx"
      VALUE: 0.5
      TOLERANCE: 1e-10
  - STRUCTURE:
      DIS: "structure"
      NODE: 9
      QUANTITY: "dispz"
      VALUE: -0.04
      TOLERANCE: 1e-10
  - STRUCTURE:
      DIS: "structure"
      NODE: 7
      QUANTITY: "dispz"
      VALUE: 0
      TOLERANCE: 1e-10
