TITLE:
  - "Two-element structure-only TSI contact: partitioned saddle-point Lagrange"

PROBLEM TYPE:
  PROBLEMTYPE: Thermo_Structure_Interaction

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: Statics
  LINEAR_SOLVER: 1

THERMAL DYNAMIC:
  LINEAR_SOLVER: 1

TSI DYNAMIC:
  MAXTIME: 1
  TIMESTEP: 1
  COUPALGO: tsi_iterstagg

TSI CONTACT:
  ENABLE_COUPLED_CONTACT: false

CONTACT DYNAMIC:
  SYSTEM: SaddlePoint
  LINEAR_SOLVER: 1

MORTAR COUPLING:
  LM_SHAPEFCN: Standard
MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: None

SOLVER 1:
  SOLVER: Superlu

MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [1000]
      NUE: 0.3
      DENS: 1
      THEXPANS: 0
      INITTEMP: 0
  - MAT: 2
    MAT_Fourier:
      CAPA: 1
      CONDUCT:
        constant: [1]

CLONING MATERIAL MAP:
  - SRC_FIELD: structure
    SRC_MAT: 1
    TAR_FIELD: thermo
    TAR_MAT: 2

DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, -0.02]
    FUNCT: [0, 0, 0]

DESIGN VOL DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 0]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]

DESIGN SURF THERMO NEUMANN CONDITIONS:
  - E: 4
    NUMDOF: 1
    ONOFF: [1]
    VAL: [10]
    FUNCT: [0]

DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 2
    InterfaceID: 1
    Side: Slave
    Initialization: Active
  - E: 3
    InterfaceID: 1
    Side: Master

