TITLE:
  - "This tests tsi contact in 3D with coulomb friction. A semi-circle is pressed onto a box and then
    slid along it, generating heat due to friction. No other heat sources are present and the thermal
    expansion of the material is set to 0. The friction coefficient is set to 0.4 initially and reduces
    with rising temperature. The heat transfer parameters are set such that 62.5% of the frictional heat
    is transferred into the box."

PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"

CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
  SEMI_SMOOTH_CN: 500
  SEMI_SMOOTH_CT: 500
  FRICTION: Coulomb

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

TSI CONTACT:
  HEATTRANSSLAVE: 10
  HEATTRANSMASTER: 6
  TEMP_REF: 20
  TEMP_DAMAGE: 120

THERMAL DYNAMIC/RUNTIME VTK OUTPUT:
  OUTPUT_THERMO: true
  TEMPERATURE: true
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  NODE_GID: true
  ELEMENT_GID: true

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  LINEAR_SOLVER: 1

THERMAL DYNAMIC:
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 1
  LINEAR_SOLVER: 1

TSI DYNAMIC:
  NUMSTEP: 20000
  MAXTIME: 2
  TIMESTEP: 0.1

TSI DYNAMIC/MONOLITHIC:
  CONVTOL: 0.0001
  TOLINC: 1e-07
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true

SOLVER 1:
  SOLVER: Superlu

MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [100]
      NUE: 0.3
      DENS: 0
      THEXPANS: 0
      INITTEMP: 20
  - MAT: 2
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [500]
      NUE: 0.3
      DENS: 0
      THEXPANS: 0
      INITTEMP: 20
  - MAT: 10
    MAT_Fourier:
      CAPA: 2
      CONDUCT:
        constant: [1]

CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 10
  - SRC_FIELD: "structure"
    SRC_MAT: 2
    TAR_FIELD: "thermo"
    TAR_MAT: 10

FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "20"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "vertical_displacement"
  - TYPE: linearinterpolation
    NAME: "vertical_displacement"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 0.5, 0.5]
    VARIABLE: 0
FUNCT3:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "horizontal_displacement"
  - TYPE: linearinterpolation
    NAME: "horizontal_displacement"
    NUMPOINTS: 3
    TIMES: [0, 1, 2]
    VALUES: [0, 0, 4]
    VARIABLE: 0

DESIGN SURF DIRICH CONDITIONS:
  - NODE_SET_NAME: semi_circle_top
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [1, -1, 0]
    FUNCT: [3, 2, null]
  - NODE_SET_NAME: box_bottom
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]

DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - NODE_SET_NAME: box_top
    InterfaceID: 1
    Side: "Slave"
    FrCoeffOrBound: 0.4
  - NODE_SET_NAME: semi_circle_contact
    InterfaceID: 1
    Side: "Master"
    FrCoeffOrBound: 0.4

STRUCTURE GEOMETRY:
  FILE: "tsi_contact3D_friction_semi_circle_on_box.msh"
  ELEMENT_BLOCKS:
    - NAME: box
      SOLIDSCATRA:
        HEX8:
          MAT: 1
          KINEM: nonlinear
          TYPE: Undefined
    - NAME: "semi_circle"
      SOLIDSCATRA:
        HEX8:
          MAT: 2
          KINEM: nonlinear
          TYPE: Undefined

