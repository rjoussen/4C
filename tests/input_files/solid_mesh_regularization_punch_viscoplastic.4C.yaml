TITLE:
  - "Plane strain punch into a viscoplastic block with mesh regularization and boundary sliding"
PROBLEM TYPE:
  PROBLEMTYPE: Structure
PROBLEM SIZE:
  DIM: 3
IO:
  STRUCT_STRESS: Cauchy
  STRUCT_STRAIN: GL
  VERBOSITY: Standard
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  ELEMENT_GID: true
  STRESS_STRAIN: true
  GAUSS_POINT_DATA_OUTPUT_TYPE: element_center
STRUCTURAL DYNAMIC:
  INT_STRATEGY: Standard
  DYNAMICTYPE: Statics
  TIMESTEP: 0.16666666666666666
  NUMSTEP: 6
  MAXTIME: 1.0
  RESTARTEVERY: 2
  TOLDISP: 1.0e-7
  TOLRES: 1.0e-6
  MAXITER: 30
  PREDICT: TangDis
  LINEAR_SOLVER: 1
  MESH REGULARIZATION:
    ENABLED: true
    INTERVAL: 2
    START_STEP: 2
    FEATURE_ANGLE: 30.0
ALE DYNAMIC:
  ALE_TYPE: mesh_quality
  MAXITER: 30
  TOLRES: 1.0e-6
  MESH_QUALITY_SIZE_WEIGHT: 1.0
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: UMFPACK
  NAME: direct_solver
MATERIALS:
  - MAT: 1
    MAT_MultiplicativeSplitDefgradElastHyper:
      NUMMATEL: 1
      MATIDSEL: [2]
      NUMFACINEL: 1
      INELDEFGRADFACIDS: [3]
      DENS: 7.83e-9
  - MAT: 2
    ELAST_CoupNeoHooke:
      YOUNG: 200000
      NUE: 0.3
  - MAT: 3
    MAT_InelasticDefgradTransvIsotropElastViscoplast:
      VISCOPLAST_LAW_ID: 4
      FIBER_READER_ID: 5
      YIELD_COND_A: 0
      YIELD_COND_B: 0
      YIELD_COND_F: 0
      MAT_BEHAVIOR: "isotropic"
      TIME_INTEGRATION_HIST_VARS: logarithmic
      ADAPTIVE_ESTIMATE_INTERPOLATION:
        USE_ADAPTIVE_ESTIMATE_INTERPOLATION: true
        ELASTIC_PREDICTOR_ZERO_COMPONENT_THRESHOLD: 1e-13
        PLASTIC_PREDICTOR_CONSTRUCTION:
          ELASTIC_STRETCH_EIGENVAL_TYPE: scale_unit
          ELASTIC_STRETCH_EIGENVECT_TYPE: from_elastic_predictor
          ELASTIC_ROTATION_TYPE: from_elastic_predictor
          MAX_ITER: 50
          RELATIVE_UNDERSTRESS_TOL: 0.000001
          INTERVAL_SCANNING_PARAM: 0.5
        ESTIMATE_INTERPOLATION:
          STARTING_POINT_TYPE: equiv_stress_history
          MAX_ITER: 50
          INTERVAL_SCANNING_PARAM: 0.5
        HARDENING_MANAGEMENT:
          METHOD: integrate_via_evolution_equations
          MAX_ITER_INTEGRATION: 50
          TOL_INTEGRATION: 1e-8
        REESTIMATION:
          MAX_NUM_REESTIMATIONS: 10
          INTERVAL_SCANNING_PARAM: 0.5
      LOCAL_NEWTON:
        CONV_CHECK: residual_and_increment_ratio
        MAX_ITER: 100
        RES_TOL: 1e-8
        INCR_TOL: 1e-8
        MAX_EXCEEDANCE_FACT_RES_TOL: 10
        MAX_EXCEEDANCE_FACT_INCR_TOL: 10
        DIVER_CONT: stop_and_request_step_reduction
  - MAT: 4
    MAT_ViscoplasticLawReformulatedJohnsonCook:
      STRAIN_RATE_PREFAC: 1
      STRAIN_RATE_EXP_FAC: 0.014
      INIT_YIELD_STRENGTH: 792
      ISOTROP_HARDEN_PREFAC: 510
      ISOTROP_HARDEN_EXP: 0.26
      REF_TEMPERATURE: 300
      MELT_TEMPERATURE: 1800
      TEMPERATURE_SENS: 1.0
  - MAT: 5
    ELAST_CoupTransverselyIsotropic:
      ALPHA: 1
      BETA: 1
      GAMMA: 1
      ANGLE: 0
      STR_TENS_ID: 100
  - MAT: 100
    ELAST_StructuralTensor:
      STRATEGY: Standard
