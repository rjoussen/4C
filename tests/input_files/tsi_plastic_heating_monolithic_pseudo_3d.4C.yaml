TITLE:
  - "Pseudo-3D plane strain variant of tsi_plastic_heating_monolithic: heating due to plastic"
  - "dissipation and thermoelastic coupling under tension. In contrast to"
  - "tsi_plastic_heating_monolithic, the z-displacements of all nodes are fixed, i.e., the problem is"
  - "plane strain. It is the 3D reference of tsi_plastic_heating_monolithic_plane_strain."
PROBLEM SIZE:
  ELEMENTS: 2
  NODES: 12
  MATERIALS: 4
  NUMDF: 6
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "GL"
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
STRUCTURAL DYNAMIC:
  RESULTSEVERY: 0
  RESTARTEVERY: 0
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "OneStepTheta"
  TIMESTEP: 1
  NUMSTEP: 10
  MAXTIME: 10
  TOLDISP: 1e-08
  TOLRES: 1e-06
  NORM_RESF: "Rel"
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC/ONESTEPTHETA:
  THETA: 1
IO/RUNTIME VTK OUTPUT:
  OUTPUT_DATA_FORMAT: ascii
  INTERVAL_STEPS: 3
IO/RUNTIME VTK OUTPUT/STRUCTURE:
  OUTPUT_STRUCTURE: true
  DISPLACEMENT: true
  STRESS_STRAIN: true
  GAUSS_POINT_DATA_OUTPUT_TYPE: nodes
THERMAL DYNAMIC:
  RESTARTEVERY: 0
  RESULTSEVERY: 0
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 1
  TIMESTEP: 0.01
  MAXTIME: 1
  TOLTEMP: 1e-08
  TOLRES: 1e-05
  ITERNORM: "Rms"
  LINEAR_SOLVER: 1
THERMAL DYNAMIC/ONESTEPTHETA:
  THETA: 1
THERMAL DYNAMIC/RUNTIME VTK OUTPUT:
  OUTPUT_THERMO: true
  TEMPERATURE: true
TSI DYNAMIC:
  RESTARTEVERY: 0
  RESULTSEVERY: 3
  NUMSTEP: 3
  MAXTIME: 90
  TIMESTEP: 30
TSI DYNAMIC/MONOLITHIC:
  CONVTOL: 1e-07
  TOLINC: 1e-08
  NORM_RESF: "Rel"
  NORMCOMBI_RESFINC: "And"
  LINEAR_SOLVER: 2
SOLVER 1:
  SOLVER: "UMFPACK"
SOLVER 2:
  SOLVER: "Belos"
  AZPREC: "Teko"
  AZREUSE: 20
  SOLVER_XML_FILE: "xml/linear_solver/iterative_gmres_template.xml"
  PRECONDITIONER_XML_FILE: "xml/block_preconditioner/thermo_solid.xml"
  NAME: "Thermo_Structure_Interaction_Solver"
MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoPlasticLinElast:
      YOUNG: 6000.0
      NUE: 0.3
      DENS: 1e-06
      THEXPANS: 1.1e-05
      INITTEMP: 300
      YIELD: 250
      ISOHARD: 0
      KINHARD: 0
      SAMPLENUM: 4
      SIGMA_Y: [250, 500, 750, 1000]
      EPSBAR_P: [0.0, 0.01, 0.1, 1.0]
      TOL: 0.0001
  - MAT: 2
    MAT_Fourier:
      CAPA: 6.445
      CONDUCT:
        constant: [1031.2]
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2
FUNCT1:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "300.0"
FUNCT2:
  - COMPONENT: 0
    SYMBOLIC_FUNCTION_OF_SPACE_TIME: "10*t"
DESIGN SURF THERMO NEUMANN CONDITIONS:
  # positive x direction
  - E: 1
    NUMDOF: 1
    ONOFF: [1]
    VAL: [0]
    FUNCT: [0]
  # negative x direction
  - E: 2
    NUMDOF: 1
    ONOFF: [1]
    VAL: [0]
    FUNCT: [0]
DESIGN SURF NEUMANN CONDITIONS:
  # positive x direction
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 0, 0]
    VAL: [1, 0, 0]
    FUNCT: [2, 2, 2]
DESIGN SURF DIRICH CONDITIONS:
  # negative x direction (the surface conditions override the volume condition, hence they
  # include the plane strain constraint)
  - E: 2
    NUMDOF: 3
    ONOFF: [1, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 3
    NUMDOF: 3
    ONOFF: [0, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DESIGN VOL DIRICH CONDITIONS:
  # plane strain
  - E: 1
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
DSURF-NODE TOPOLOGY:
  # X+
  - "NODE 9 DSURFACE 1"
  - "NODE 10 DSURFACE 1"
  - "NODE 11 DSURFACE 1"
  - "NODE 12 DSURFACE 1"
  # X-
  - "NODE 1 DSURFACE 2"
