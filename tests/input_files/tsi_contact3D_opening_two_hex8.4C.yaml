TITLE:
  - "Two HEX8 elements in frictionless TSI contact are pressed together, so that heat is conducted from
    the hot upper element into the cold lower one, and then lifted off. With one-step-theta and theta=0.5,
    half of the contact heat flux of the last closed step still enters the step in which the contact opens.
    This test fails if that old contact flux is dropped once no node is active anymore."
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
CONTACT DYNAMIC:
  LINEAR_SOLVER: 1
MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"
TSI CONTACT:
  HEATTRANSSLAVE: 10
  HEATTRANSMASTER: 10
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  LINEAR_SOLVER: 1
THERMAL DYNAMIC:
  DYNAMICTYPE: OneStepTheta
  INITIALFIELD: "field_by_function"
  INITFUNCNO: 1
  LINEAR_SOLVER: 1
THERMAL DYNAMIC/ONESTEPTHETA:
  THETA: 0.5
TSI DYNAMIC:
  NUMSTEP: 3
  MAXTIME: 0.3
  TIMESTEP: 0.1
TSI DYNAMIC/MONOLITHIC:
  LINEAR_SOLVER: 1
  MERGE_TSI_BLOCK_MATRIX: true
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_Struct_ThermoStVenantK:
      YOUNGNUM: 1
      YOUNG: [1000]
      NUE: 0
      DENS: 0
      THEXPANS: 0
      INITTEMP: 20
  - MAT: 2
    MAT_Fourier:
      CAPA: 1
      CONDUCT:
        constant: [1]
CLONING MATERIAL MAP:
  - SRC_FIELD: "structure"
    SRC_MAT: 1
    TAR_FIELD: "thermo"
    TAR_MAT: 2
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "20"
FUNCT2:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "a"
  - TYPE: linearinterpolation
    NAME: "a"
    NUMPOINTS: 4
    TIMES: [0, 0.1, 0.2, 0.3]
    VALUES: [0, 0.01, 0.01, -0.05]
    VARIABLE: 0
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 4
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, -1, 0]
    FUNCT: [0, 2, 0]
DESIGN SURF THERMO DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 1
    ONOFF: [1]
    VAL: [20]
    FUNCT: [0]
  - E: 4
    NUMDOF: 1
    ONOFF: [1]
    VAL: [100]
    FUNCT: [0]
DESIGN SURF MORTAR CONTACT CONDITIONS 3D:
  - E: 3
    InterfaceID: 1
    Side: "Slave"
    Initialization: "Active"
  - E: 2
    InterfaceID: 1
    Side: "Master"
