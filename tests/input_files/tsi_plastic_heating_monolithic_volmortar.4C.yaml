TITLE:
  - "Variant of tsi_plastic_heating_monolithic with non-matching meshes coupled by volume mortar:"
  - "a fine structural mesh (4x2x2 hex8) and a coarse thermal mesh (2x1x1 hex8, element boundary"
  - "at x=3)."
  - "The bar is thermoplastic for x<2 and thermoelastic for x>2. Hence, the plastic history"
  - "differs between the structural elements, and the first thermal element covers both regions."
  - "The plastic dissipation is evaluated at the Gauss points of the structural elements, where the"
  - "plastic history lives, and transferred to the thermal mesh with the transposed volume mortar"
  - "projection."
  - "The same problem with matching meshes yields temperatures that deviate by less than 3e-4 from"
  - "the ones here, since the conduction equilibrates the temperature within each time step and"
  - "the transfer conserves the heat."
IO:
  STRUCT_STRESS: "Cauchy"
  STRUCT_STRAIN: "GL"
PROBLEM TYPE:
  PROBLEMTYPE: "Thermo_Structure_Interaction"
STRUCTURAL DYNAMIC:
  RESULTSEVERY: 0
  RESTARTEVERY: 0
  INT_STRATEGY: "Standard"
  DYNAMICTYPE: "OneStepTheta"
  TIMESTEP: 1
  NUMSTEP: 10
  MAXTIME: 10
  TOLDISP: 1e-08
  TOLRES: 1e-06
  NORM_RESF: "Rel"
  LINEAR_SOLVER: 1
STRUCTURAL DYNAMIC/ONESTEPTHETA:
  THETA: 1
IO/RUNTIME VTK OUTPUT:
  OUTPUT_DATA_FORMAT: ascii
  INTERVAL_STEPS: 3
IO/RUNTIME VTK OUTPUT/STRUCTURE:
