TITLE:
  - "Two HEX8 cubes in frictionless contact. The stiffer upper cube (slave) is offset by 0.3 in x and
    pressed into the lower cube (master). The problem is symmetric in z, so the overlap polygon of the
    contact faces is a symmetric trapezoid whose vertices lie on one circle. Its Delaunay triangulation
    is not unique and used to change between Newton iterations, so Newton did not converge in the last
    step."

PROBLEM TYPE:
  PROBLEMTYPE: "Structure"

MORTAR COUPLING:
  TRIANGULATION: "Delaunay"

MORTAR COUPLING/PARALLEL REDISTRIBUTION:
  PARALLEL_REDIST: "None"

CONTACT DYNAMIC:
  LINEAR_SOLVER: 1

STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.1
  NUMSTEP: 10
  MAXTIME: 1
  MAXITER: 20
  TOLDISP: 1e-10
  TOLRES: 1e-8
  LINEAR_SOLVER: 1

SOLVER 1:
